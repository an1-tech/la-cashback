name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Kiểm tra định dạng, nghiệp vụ, build và trình duyệt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra định dạng (Prettier)
        run: npx prettier --check src server scripts tests e2e *.js *.json index.html README.md docs

      - name: Kiểm thử nghiệp vụ và API
        run: npm test

      - name: Build giao diện
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Kiểm thử trình duyệt
        run: npm run test:ui

      - name: Lưu ảnh chụp và trace khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/playwright
          retention-days: 7

  docker:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build image dùng trên Render
        run: docker build --tag la-cashback:ci .
      - name: Khởi động container ở chế độ demo công khai
        run: |
          export DEMO_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DEMO_ADMIN_PASSWORD"
          docker run --detach --name la-cashback-ci \
            --publish 127.0.0.1:3082:3080 \
            --env PUBLIC_DEMO=true --env COOKIE_SECURE=true \
            --env DEMO_ADMIN_PASSWORD la-cashback:ci
      - name: Kiểm tra HTTP, dữ liệu và tài sản trong container
        run: node scripts/smoke-container.mjs http://127.0.0.1:3082
      - name: Log container khi lỗi
        if: failure()
        run: docker logs la-cashback-ci
      - name: Dừng container
        if: always()
        run: docker rm --force la-cashback-ci
